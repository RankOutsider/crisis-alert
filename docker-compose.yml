# Định nghĩa các dịch vụ (container)
services:

  # 1. Dịch vụ Database (MySQL)
  db:
    image: mysql:8.0
    container_name: crisis-alert-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: crisis_alert_db
    ports:
      - '3307:3306'
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Dịch vụ Backend (API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crisis-alert-api
    # command: npm run start # Dùng lệnh này để chạy production build
    command: npm run dev
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: crisis_alert_db
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_HOST: ${EMAIL_HOST}
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  # 3. Dịch vụ Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args: 
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: crisis-alert-web

    # command: npm run start # Dùng lệnh này để chạy production build
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    depends_on:
      - backend

  # --- 4. Dịch vụ Bot Cronjob ---
  backend-cron:
    build:
      context: ./backend      # Dùng chung code và Dockerfile với backend
      dockerfile: Dockerfile
    container_name: crisis-alert-cron
    restart: unless-stopped
    environment:              # Cần các biến môi trường để kết nối DB
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: crisis_alert_db
      # Env vars cho email service
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_HOST: ${EMAIL_HOST}
    volumes:
      - ./backend:/app         # Dùng chung code
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy # Chỉ chạy khi DB đã sẵn sàng
    command: >
      sh -c "while true; do 
        echo '[CRON] Bắt đầu chạy scan_job.js...'; 
        node /app/utils/scan_job.js; 
        echo '[CRON] Đã chạy xong. Chờ 1 phút (60 giây)...'; 
        sleep 60; 
      done"

# Định nghĩa 1 volume tên là 'mysql_data' để lưu trữ dữ liệu MySQL
volumes:
  mysql_data: